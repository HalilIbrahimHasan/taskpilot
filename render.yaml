databases:
  - name: taskpilot-db
    databaseName: taskpilot
    user: taskpilot
    plan: free

services:
  - type: web
    name: taskpilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -e .
    preDeployCommand: alembic upgrade head && python -m app.seed
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: taskpilot-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: taskpilot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
