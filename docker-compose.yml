services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskpilot
      POSTGRES_USER: taskpilot
      POSTGRES_PASSWORD: taskpilot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskpilot -d taskpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - taskpilot_postgres:/var/lib/postgresql/data

volumes:
  taskpilot_postgres:
